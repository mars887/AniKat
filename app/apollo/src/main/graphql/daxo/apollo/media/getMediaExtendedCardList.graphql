query GetMediaExtendedCardFilteredQuery(
    $page: Int = 1,
    $perPage: Int = 10,
    $type: MediaType = ANIME,
    $sort: [MediaSort] = [POPULARITY_DESC],
    $season: MediaSeason,
    $seasonYear: Int,
    $genre: String,
    $format: MediaFormat,
    $search: String,
    $isAdult: Boolean
) {
    Page(page: $page, perPage: $perPage) {
        media(
            type: $type,
            sort: $sort,
            season: $season,
            seasonYear: $seasonYear,
            genre: $genre,
            format: $format,
            search: $search,
            isAdult: $isAdult
        ) {
            id
            type
            title {
                ... mediaTitle
            }
            studios {
                ... basicStudioQuery
            }
            season
            seasonYear
            nextAiringEpisode {
                ... nextAiringEpisode
            }
            format
            description
            episodes
            genres
            averageScore
            favourites
            popularity
            seasonYear
            coverImage {
                ... mediaCoverImage
            }
            bannerImage
        }
    }
}
