[versions]
agp = "8.6.1"
apolloRuntime = "4.1.0"
apolloNormalizedCache = "4.1.0"
blurry = "4.0.1"
fragmentKtx = "1.8.5"
glide = "4.16.0"
gson = "2.11.0"
kotlin = "2.0.21"
coreKtx = "1.15.0"
appcompat = "1.7.0"
